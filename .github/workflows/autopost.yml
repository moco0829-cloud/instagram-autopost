name: Instagram 自動投稿

on:
  schedule:
    # 投稿は1日2回（朝 8:00・夜 19:00）。
    # GitHub Actions の cron は UTC（日本時間 = UTC + 9 時間）で、混雑すると数時間遅れることがある。
    # そこで投稿時刻より前に3回ずつ仕掛け、最初に動いた回が画像と文章を作り、投稿時刻まで待ってから投稿する。
    # 区切りのいい時刻（毎時0分）は混みやすいので避ける。
    - cron: "23 20 * * *"  # 朝の枠 05:23 JST
    - cron: "23 21 * * *"  # 朝の枠 06:23 JST
    - cron: "7 22 * * *"   # 朝の枠 07:07 JST
    - cron: "23 7 * * *"   # 夜の枠 16:23 JST
    - cron: "23 8 * * *"   # 夜の枠 17:23 JST
    - cron: "7 9 * * *"    # 夜の枠 18:07 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠（空欄なら夜）"
        type: choice
        options: ["", morning, night]
        default: ""
      topic:
        description: "テーマの指定（空欄ならおまかせ）"
        type: string
        default: ""
      dry_run:
        description: "画像と文章を作るだけで、Instagram には投稿しない"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  check:
    # 定期実行は、Settings → Variables で AUTOPOST_ENABLED を true にするまで動かない
    # （試し実行で内容を確認してから、自動投稿を始めるため）。手動実行はいつでも動く
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPOST_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      slot: ${{ steps.check.outputs.slot }}
      post_at: ${{ steps.check.outputs.post_at }}
    steps:
      # 順番待ちのあいだに前の回が投稿していることがあるので、起動時点ではなく今の main を見る
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 今日の投稿が必要か確認
        id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          today = now.strftime("%Y-%m-%d")
          # 午前に動いた回は朝 8:00 の枠、午後に動いた回は夜 19:00 の枠
          if os.environ["EVENT"] == "schedule":
              slot = "morning" if now.hour < 12 else "night"
          else:
              slot = os.environ.get("INPUT_SLOT") or "night"
          post_at, give_up = {"morning": ("08:00", 10), "night": ("19:00", 21)}[slot]
          name = {"morning": "朝", "night": "夜"}[slot]
          skip, reason = False, ""
          if os.environ["EVENT"] == "schedule":
              history = json.load(open("history.json", encoding="utf-8"))
              if any(h["date"] == today and h["slot"] == slot for h in history):
                  skip, reason = True, f"今日の{name}の投稿はもう済んでいます"
              elif now.hour >= give_up:
                  # 実行が大きく遅れたときは、時間外に投稿しないよう見送る
                  skip, reason = True, f"開始が {now:%H:%M} と遅すぎるので、今日の{name}の投稿は見送ります"
          print(reason or f"{now:%H:%M} 開始。{name}（{post_at}）の投稿を作ります")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\nslot={slot}\npost_at={post_at}\n")
          PY

  post:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 投稿時刻まで待つことがあるので長めにとる
    timeout-minutes: 240
    steps:
      # 順番待ちのあいだに前の回が投稿していることがあるので、起動時点ではなく今の main を見る
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 日本語フォント（明朝体）を入れる
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 文章と画像を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
        run: python autopost.py generate --slot "${{ needs.check.outputs.slot }}" --topic "$TOPIC"

      - name: 画像をリポジトリに保存（Instagram が読める公開URLにするため）
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "post: $(jq -r '.date + " " + .slot + " " + .theme' posts/latest.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 投稿時刻まで待つ
        if: github.event_name == 'schedule'
        env:
          POST_AT: ${{ needs.check.outputs.post_at }}
        run: |
          now=$(date +%s)
          target=$(TZ=JST-9 date -d "today $POST_AT" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$(( (target - now) / 60 )) 分待って、$POST_AT に投稿します"
            sleep $(( target - now ))
          else
            echo "$POST_AT を過ぎているので、すぐに投稿します"
          fi

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish

      - name: Facebook ページにも投稿
        if: ${{ !inputs.dry_run }}
        # Facebook 側で失敗しても、Instagram の投稿と履歴の保存は止めない
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish-facebook

      - name: 投稿履歴を保存
        if: ${{ !inputs.dry_run }}
        run: |
          git add history.json posts/latest.json
          git commit -m "history: $(jq -r '.media_id' posts/latest.json)"
          git push
