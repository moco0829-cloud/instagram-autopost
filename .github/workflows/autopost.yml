name: Instagram 自動投稿

on:
  schedule:
    # GitHub Actions の cron は UTC（日本時間 = UTC + 9 時間）で、混雑すると数時間遅れることがある。
    # そこで 19 時より前に3回仕掛け、最初に動いた回が画像と文章を作って 19:00 まで待ってから投稿する。
    # 区切りのいい時刻（毎時0分）は混みやすいので避ける。
    - cron: "23 7 * * *"  # 16:23 JST
    - cron: "23 8 * * *"  # 17:23 JST
    - cron: "7 9 * * *"   # 18:07 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠（空欄なら夜）"
        type: choice
        options: ["", morning, noon, night]
        default: ""
      dry_run:
        description: "画像と文章を作るだけで、Instagram には投稿しない"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  check:
    # 定期実行は、Settings → Variables で AUTOPOST_ENABLED を true にするまで動かない
    # （試し実行で内容を確認してから、自動投稿を始めるため）。手動実行はいつでも動く
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPOST_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: 今日の投稿が必要か確認
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          now = datetime.now(timezone(timedelta(hours=9)))
          today = now.strftime("%Y-%m-%d")
          skip, reason = False, ""
          if os.environ["EVENT"] == "schedule":
              history = json.load(open("history.json", encoding="utf-8"))
              if any(h["date"] == today and h["slot"] == "night" for h in history):
                  skip, reason = True, "今日の夜の投稿はもう済んでいます"
              elif now.hour >= 21:
                  # 実行が大きく遅れた日は、深夜に投稿しないよう見送る
                  skip, reason = True, f"開始が {now:%H:%M} と遅すぎるので、今日の投稿は見送ります"
          print(reason or f"{now:%H:%M} 開始。投稿を作ります")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
          PY

  post:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # 19:00 まで待つことがあるので長めにとる
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 日本語フォント（明朝体）を入れる
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 文章と画像を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python autopost.py generate --slot "${{ inputs.slot || 'night' }}"

      - name: 画像をリポジトリに保存（Instagram が読める公開URLにするため）
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "post: $(jq -r '.date + " " + .slot + " " + .theme' posts/latest.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 19:00 まで待つ
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=JST-9 date -d "today 19:00" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "$(( (target - now) / 60 )) 分待ってから投稿します"
            sleep $(( target - now ))
          else
            echo "19:00 を過ぎているので、すぐに投稿します"
          fi

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish

      - name: Facebook ページにも投稿
        if: ${{ !inputs.dry_run }}
        # Facebook 側で失敗しても、Instagram の投稿と履歴の保存は止めない
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish-facebook

      - name: 投稿履歴を保存
        if: ${{ !inputs.dry_run }}
        run: |
          git add history.json posts/latest.json
          git commit -m "history: $(jq -r '.media_id' posts/latest.json)"
          git push
