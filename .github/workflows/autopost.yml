name: Instagram 自動投稿

on:
  schedule:
    # GitHub Actions の cron は UTC。日本時間 = UTC + 9 時間
    - cron: "0 10 * * *"  # 毎日 19:00 JST
  workflow_dispatch:
    inputs:
      slot:
        description: "投稿枠（空欄なら現在時刻から自動判定）"
        type: choice
        options: ["", morning, noon, night]
        default: ""
      dry_run:
        description: "画像と文章を作るだけで、Instagram には投稿しない"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    # 定期実行は、Settings → Variables で AUTOPOST_ENABLED を true にするまで動かない
    # （試し実行で内容を確認してから、自動投稿を始めるため）。手動実行はいつでも動く
    if: github.event_name == 'workflow_dispatch' || vars.AUTOPOST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 日本語フォント（明朝体）を入れる
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: 文章と画像を生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            python autopost.py generate --slot "${{ inputs.slot }}"
          else
            python autopost.py generate
          fi

      - name: 画像をリポジトリに保存（Instagram が読める公開URLにするため）
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts
          git commit -m "post: $(jq -r '.date + " " + .slot + " " + .theme' posts/latest.json)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instagram に投稿
        if: ${{ !inputs.dry_run }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_COMMIT_SHA: ${{ steps.push.outputs.sha }}
        run: python autopost.py publish

      - name: 投稿履歴を保存
        if: ${{ !inputs.dry_run }}
        run: |
          git add history.json posts/latest.json
          git commit -m "history: $(jq -r '.media_id' posts/latest.json)"
          git push
