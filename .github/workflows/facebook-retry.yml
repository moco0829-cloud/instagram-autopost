name: Facebook に投稿（最新の投稿をもう一度）

# Instagram に出した最新の投稿を、Facebook ページだけに投稿する。
# Facebook への投稿が失敗した日のやり直しや、設定の確認に使う。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Facebook ページに投稿
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_COMMIT_SHA: ${{ github.sha }}
        run: python autopost.py publish-facebook

      - name: 投稿履歴を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json posts/latest.json
          git diff --cached --quiet || git commit -m "facebook: $(jq -r '.fb_post_id' posts/latest.json)"
          git push
