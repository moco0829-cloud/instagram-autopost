name: 下書きを投稿する

# 試し実行（dry_run）で作った最新の下書き（posts/latest.json）を、そのまま Instagram と Facebook に投稿する。
# 中身を確認してから投稿したいときや、時刻を過ぎて投稿し直したいときに使う。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 画像が入っているコミットを調べる
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Instagram に投稿
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: python autopost.py publish

      - name: Facebook ページにも投稿
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IMAGE_COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: python autopost.py publish-facebook

      - name: 投稿履歴を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json posts/latest.json
          git commit -m "history: $(jq -r '.media_id' posts/latest.json)"
          git push
