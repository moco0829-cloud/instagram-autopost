name: Instagram トークン延長

# Instagram の長期アクセストークンは60日で切れるため、週1回延長して Secret を上書きする
on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 9:00 JST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 確認（一時的）
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          OLD_TOKEN=$(printf %s "$IG_ACCESS_TOKEN" | tr -d '[:space:]')
          if curl -sf "https://graph.instagram.com/v23.0/me?fields=user_id&access_token=$OLD_TOKEN" > /dev/null; then
            echo "Instagram: 登録中のトークンは有効です"
          else
            echo "Instagram: 登録中のトークンが使えません"
          fi
          echo "GH_PAT の種類: ${GH_TOKEN:0:4}… 長さ ${#GH_TOKEN} 文字"
          gh api -i "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" 2>&1             | grep -i -E '^HTTP|x-accepted-github-permissions|"message"' || true

      - name: トークンを延長して Secret を更新
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(python autopost.py refresh-token)
          echo "::add-mask::$NEW_TOKEN"
          OLD_TOKEN=$(printf %s "$IG_ACCESS_TOKEN" | tr -d '[:space:]')
          # 延長しても文字列が変わらなければ、有効期限が延びただけなので Secret の更新は要らない
          if [ "$NEW_TOKEN" = "$OLD_TOKEN" ]; then
            echo "トークンの有効期限を延長しました（文字列は変わらないので Secret の更新は不要）"
          else
            gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
            echo "新しいトークンで Secret を更新しました"
          fi
