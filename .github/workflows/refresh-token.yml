name: Instagram トークン延長

# Instagram の長期アクセストークンは60日で切れるため、週1回延長して Secret を上書きする
on:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 9:00 JST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: トークンを延長して Secret を更新
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN=$(python autopost.py refresh-token)
          echo "::add-mask::$NEW_TOKEN"
          OLD_TOKEN=$(printf %s "$IG_ACCESS_TOKEN" | tr -d '[:space:]')
          # 延長しても文字列が変わらなければ、有効期限が延びただけなので Secret の更新は要らない
          if [ "$NEW_TOKEN" = "$OLD_TOKEN" ]; then
            echo "トークンの有効期限を延長しました（文字列は変わらないので Secret の更新は不要）"
          else
            gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
            echo "新しいトークンで Secret を更新しました"
          fi
